# Serveur de Langue : salles en ligne (Durable Objects) + jetons Azure Speech.
# Déployé par .github/workflows/server.yml (secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, AZURE_SPEECH_KEY, AZURE_SPEECH_REGION).
name = "langue"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Le site de l'application (GitHub Pages) et le développement local.
ALLOWED_ORIGINS = "https://lle4000.github.io,http://localhost:5173,http://localhost:4173,http://localhost:4174"
# Garde-fou de facturation Azure : jetons délivrés par jour, tous appareils confondus.
AZURE_TOKENS_PER_DAY = "300"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# Durable Objects adossés à SQLite : disponibles avec l'offre gratuite de Cloudflare.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Quota"]

[observability]
enabled = true
